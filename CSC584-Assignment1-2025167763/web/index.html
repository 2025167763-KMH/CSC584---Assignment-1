<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Profile Form</title>
    <!-- Bootstrap CSS for Responsive Design & Layout -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .form-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-top: 50px; margin-bottom: 50px; }
        .form-header { color: #0d6efd; font-weight: bold; border-bottom: 2px solid #e9ecef; padding-bottom: 15px; margin-bottom: 25px; }
        .input-group-text { background-color: #0d6efd; color: white; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="form-card">
                    <h3 class="form-header"><i class="fas fa-user-edit"></i> Create Your Profile</h3>
                    
                    <form action="ProfileServlet" method="POST">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Full Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                                    <input type="text" class="form-control" name="name" required placeholder="Anwar Ibrahim">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Student ID</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-id-badge"></i></span>
                                    <input type="text" class="form-control" name="studentId" required placeholder="2001167763">
                                </div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Program</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-graduation-cap"></i></span>
                                    <select class="form-select" name="program" required>
                                        <option value="" disabled selected>Select your program...</option>
                                        <option value="Computer Science">Computer Science</option>
                                        <option value="Information Technology">Information Technology</option>
                                        <option value="Software Engineering">Science Politics</option>
                                        <option value="Data Science">Data Science</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                    <input type="email" class="form-control" name="email" required placeholder="nuarbrahim@student.uitm.edu.my">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><i class="fas fa-heart text-danger"></i> Hobbies</label>
                            <div class="d-flex flex-wrap gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="hobbies" value="Coding" id="hobby1">
                                    <label class="form-check-label" for="hobby1">Coding</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="hobbies" value="Food Hunting" id="hobby2">
                                    <label class="form-check-label" for="hobby2">Food Hunting</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="hobbies" value="Indoor Sports" id="hobby3">
                                    <label class="form-check-label" for="hobby3">Indoor Sports</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="hobbies" value="Outdoor Sports" id="hobby4">
                                    <label class="form-check-label" for="hobby4">Outdoor Sports </label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label"><i class="fas fa-comment-dots"></i> About You!</label>
                            <textarea class="form-control" name="intro" rows="4" required placeholder="Tell us a little bit about yourself..."></textarea>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-paper-plane"></i> Submit Profile</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
